[package]
name = "iai"
version = "0.1.0"
edition = "2024"
description = "A high-performance, GPU-accelerated image editor written in Rust."
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
readme = "README.md"

# The app is the root package; the crates under crates/ and the checks in
# xtask/ are members beside it. A plain `cargo build` / `cargo test` at the
# root still means the app alone.
[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

# The library holds the whole application; the binary is a thin entry point.
# Tests compile against the library, not the binary's module tree.
[lib]
name = "iai"
path = "src/lib.rs"

[features]
default = []
# The Pro pack: the "AI" window (ID photos, garments, portrait retouch, print
# sheets, Gemini / ChatGPT) and the key that opens it. A build without it
# (`--no-default-features`) is the free core, whole.
pro = ["raw-dll", "dep:socket2", "dep:tungstenite", "iai-imaging/pro", "iai-ai/pro"]
# The library that decodes camera RAW files (crates/iai-raw: rawloader and
# rawler, both LGPL-2.1) is loaded at run time from iai_raw.dll beside the
# exe instead of being linked into it, so that whoever has the app can put a
# build of their own in its place. A build with parts that are not open has to
# have it this way; a build without the feature links the library in.
raw-dll = ["iai-formats/raw-dll"]
jzazbz-prototype = []
canvas-editor-webview = ["dep:wry"]
dev-tools = []

[[bin]]
name = "iai"
path = "src/main.rs"

# Development tools beside the app, built only when asked for
# (`cargo run --release --features dev-tools --bin text_spike -- <dir>`), so a
# release build links one program, not four.
[[bin]]
name = "color_probe"
path = "src/bin/color_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "raw_ids"
path = "src/bin/raw_ids.rs"
required-features = ["dev-tools"]

[[bin]]
name = "text_spike"
path = "src/bin/text_spike.rs"
required-features = ["dev-tools"]

[dependencies]
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "29"
pollster = "0.3"
bytemuck = { version = "1.0", features = ["derive"] }
rayon = "1"
image = "0.25"
rfd = "0.15"
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"
png = "0.17"
tiff = "0.11"
lcms2 = "6"
lcms2-sys = "4"
foreign-types-shared = "0.3"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Locks that a panic on another thread does not poison: a job that fails
# while it holds one leaves the app running. Already in the tree through wgpu.
parking_lot = "0.12"
flate2 = "1"
# What a decoded RAW file is to the app, and the interface of the library
# that decodes it.
iai-raw-api = { path = "crates/iai-raw-api" }
iai-formats = { path = "crates/iai-formats" }
iai-gpu = { path = "crates/iai-gpu" }
iai-diag = { path = "crates/iai-diag" }
iai-engine = { path = "crates/iai-engine" }
iai-automation = { path = "crates/iai-automation" }
iai-canvas = { path = "crates/iai-canvas" }
iai-ai = { path = "crates/iai-ai" }
iai-layout = { path = "crates/iai-layout" }
iai-imaging = { path = "crates/iai-imaging" }
iai-develop = { path = "crates/iai-develop" }
iai-text = { path = "crates/iai-text" }
iai-vector = { path = "crates/iai-vector" }
iai-history = { path = "crates/iai-history" }
iai-doc = { path = "crates/iai-doc" }
iai-platform = { path = "crates/iai-platform" }
iai-print = { path = "crates/iai-print" }
iai-raster = { path = "crates/iai-raster" }
iai-color = { path = "crates/iai-color" }
iai-geom = { path = "crates/iai-geom" }
# That library: rawloader, and rawler for what rawloader does not read. Both
# declare LGPL-2.1; binary distribution obligations and the complete license
# text are documented in THIRD_PARTY.md and licenses/. With `raw-dll` the app
# calls nothing of this crate, and nothing of it is linked into the exe: it is
# built beside it, as iai_raw.dll.
iai-raw = { path = "crates/iai-raw" }
ort = { version = "2.0.0-rc.12", features = ["directml"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json", "multipart"], default-features = false }
ab_glyph = "0.2"
egui-phosphor = "0.12.0"
base64 = "0.22"
# The bridge to the browser extension (src/app/ext_bridge.rs), of the Pro part.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
socket2 = { version = "0.6", optional = true }
hayro = "0.7.1"
lopdf = { version = "0.43", default-features = false }
i_overlay = "7.0.2"
lyon_path = "1"
lyon_tessellation = "1"
unicode-normalization = "0.1"
hmac-sha256 = "1.1.14"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "sys-locale"] }
# Mail-merge data sources: CSV and Excel (.xlsx/.xls). calamine is pure-Rust and
# reuses quick-xml/zip/chrono already in the tree; `dates` formats Excel serial
# dates via chrono for Vietnamese dd/mm/yyyy contract fields.
csv = "1"
calamine = { version = "0.26", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Turns the symbol names the flight recorder's watcher reads out of the PDB
# back into Rust paths. Already in the tree through std's backtrace support.
rustc-demangle = "0.1"
# Draws the bank-transfer QR code of "Ủng hộ tác giả" (src/core/vietqr.rs).
# MIT, no dependencies of its own.
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
# The Win32_System_Diagnostics_* / Threading / Memory / ProcessStatus / Kernel /
# SystemInformation features serve the flight recorder's watcher process
# (src/diag/watch.rs): it walks the app's stacks from outside through dbghelp.
# Win32_System_DataExchange reads the resolution an image on the clipboard
# carries (src/app/os_clipboard.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "=0.56.1", optional = true }

# Embeds the app icon into iai.exe (see build.rs) so Explorer and the Windows
# taskbar show the iAi logo instead of the generic executable icon.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in", "glsl-out", "hlsl-out"] }
# The GPU crate's shader checks, for the app's own shader tests.
iai-gpu = { path = "crates/iai-gpu", features = ["shader-check"] }

[lints]
workspace = true

# Every crate of the workspace opts into these with `[lints] workspace = true`.
[workspace.lints.rust]
# Unsafe code only where a function or module says why it needs it, with
# `#[allow(unsafe_code)]`: today the Win32, GDI, lcms2 and DLL bridges.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

# Clippy is a blocking check in CI (`cargo xtask lints`). These five lints are
# switched off for the whole workspace, each for a reason that holds
# everywhere it fires:
[workspace.lints.clippy]
# Published colour-science constants are kept digit for digit.
excessive_precision = "allow"
# `.max(lo).min(hi)` sends NaN to `lo` and accepts lo > hi; `clamp` returns NaN
# for the first and panics on the second.
manual_clamp = "allow"
# Index loops over pixel and tile buffers are the idiom of this code.
needless_range_loop = "allow"
# Long signatures and nested channel types are split up with the functions
# that own them (plan QC-11), not one lint at a time.
too_many_arguments = "allow"
type_complexity = "allow"
# Never crash, and say why unsafe code is sound. Tests may unwrap and panic
# (clippy.toml); elsewhere `cargo xtask lints` holds each crate to the number
# of these xtask/lint-budget.txt allows, which may only go down.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

# This crate has a large GUI/image-processing dependency graph. Test debug info
# makes the Unix linker use substantially more memory and disk while adding
# little value to ordinary test failures (file/line panic locations remain).
[profile.test]
debug = 0

# Optimized release builds — an image editor is CPU/GPU bound, so the extra
# build time is worth it for noticeably faster compositing, filters and I/O.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Line tables for this crate only, so the flight recorder can name the source
# line a stalled thread was on. They live in iai.pdb; the exe is unchanged.
[profile.release.package.iai]
debug = "line-tables-only"
