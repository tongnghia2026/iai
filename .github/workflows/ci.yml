name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate. IAI ships on Windows, so this is the job that must stay green.
  # `cargo test` also covers shader validation: the WGSL is parsed and validated
  # by naga in-process (see gpu/compositor.rs, gpu/mod.rs), and the CPU/GPU
  # parity tests pin the constants the shaders and the Rust engine share.
  test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Test (includes WGSL validation)
        run: cargo test --locked

  # Portability gate (blocking). Linux and macOS must keep compiling. Now that
  # `cargo check` passes on both, this enforces the source stays cross-platform
  # instead of only reporting how far off it is. Still a compile check, not a
  # full build+test or a release target — upgrading to those is a later step,
  # each flipped on once it is verified green on the platform.
  portability:
    name: Compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        # Matches the README's Debian/Ubuntu list (minus the removed webview
        # deps): a C toolchain + pkg-config for lcms2-sys, and the X11/Wayland
        # dev libs winit/rfd/arboard link against once this flips to a full build.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev liblcms2-dev
      - name: Check
        run: cargo check --locked --all-targets

  clippy:
    name: Clippy (informational)
    runs-on: windows-latest
    # ~300 pre-existing warnings; report only until the backlog is burned
    # down, then flip to blocking with `-- -D warnings`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked
