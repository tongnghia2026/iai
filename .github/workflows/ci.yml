name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate. IAI ships on Windows, so this is the job that must stay green.
  # `cargo test` also covers shader validation: the WGSL is parsed and validated
  # by naga in-process (see gpu/compositor.rs, gpu/mod.rs), and the CPU/GPU
  # parity tests pin the constants the shaders and the Rust engine share.
  test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Test (includes WGSL validation)
        run: cargo test --locked

  # Portability watch. IAI has no non-Windows release target today and these
  # have never been green, so they are informational: they exist to show how far
  # the library is from building elsewhere, not to block a Windows fix.
  # Flip a platform to blocking once it actually passes.
  portability:
    name: Compile check (${{ matrix.os }}) — informational
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev pkg-config
      - name: Check
        run: cargo check --locked --all-targets

  clippy:
    name: Clippy (informational)
    runs-on: windows-latest
    # ~300 pre-existing warnings; report only until the backlog is burned
    # down, then flip to blocking with `-- -D warnings`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked
