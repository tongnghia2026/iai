[package]
name = "iai-color"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_color"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.0", features = ["derive"] }
foreign-types-shared = "0.3"
lcms2 = "6"
lcms2-sys = "4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[lints]
workspace = true
