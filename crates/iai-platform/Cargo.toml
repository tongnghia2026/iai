[package]
name = "iai-platform"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_platform"
path = "src/lib.rs"

[dependencies]
# The system clipboard's images (clipboard.rs).
arboard = "3.6.1"

[target.'cfg(windows)'.dependencies]
# DataExchange / Memory: the resolution a clipboard image carries; Registry /
# UI_Shell: Explorer's file types and the Desktop shortcut.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Shell"] }

[lints]
workspace = true
