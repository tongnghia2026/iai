[package]
name = "iai-ai"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_ai"
path = "src/lib.rs"

[features]
# The Pro part's models: portrait retouch, face mesh, pose, body parts, and
# the edits sent to Gemini / ChatGPT.
pro = []

[dependencies]
iai-platform = { path = "../iai-platform" }
base64 = "0.22"
hmac-sha256 = "1.1.14"
image = "0.25"
ort = { version = "2.0.0-rc.12", features = ["directml"] }
parking_lot = "0.12"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
