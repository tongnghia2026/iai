[package]
name = "iai-doc"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_doc"
path = "src/lib.rs"

[dependencies]
iai-color = { path = "../iai-color" }
iai-geom = { path = "../iai-geom" }
iai-raster = { path = "../iai-raster" }
base64 = "0.22"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
