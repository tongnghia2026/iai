[package]
name = "iai-develop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_develop"
path = "src/lib.rs"

[dependencies]
iai-color = { path = "../iai-color" }
iai-doc = { path = "../iai-doc" }
iai-platform = { path = "../iai-platform" }
iai-raster = { path = "../iai-raster" }
foreign-types-shared = "0.3"
hmac-sha256 = "1.1.14"
lcms2 = "6"
lcms2-sys = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[lints]
workspace = true
