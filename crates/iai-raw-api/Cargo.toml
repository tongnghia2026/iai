[package]
name = "iai-raw-api"
version = "0.1.0"
edition = "2024"
description = "What a camera RAW file decodes to, as iAi takes it from the library that decodes it."
# The interface between iAi and its RAW library (crates/iai-raw). Permissive,
# so that a library built to this interface may carry any licence of its own.
license = "MIT"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_raw_api"
path = "src/lib.rs"

[lints]
workspace = true
