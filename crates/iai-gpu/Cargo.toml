[package]
name = "iai-gpu"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_gpu"
path = "src/lib.rs"

[features]
# The shader checks (naga), for the app's own tests.
shader-check = ["dep:naga"]

[dependencies]
iai-color = { path = "../iai-color" }
iai-develop = { path = "../iai-develop" }
iai-doc = { path = "../iai-doc" }
iai-geom = { path = "../iai-geom" }
iai-imaging = { path = "../iai-imaging" }
iai-raster = { path = "../iai-raster" }
iai-vector = { path = "../iai-vector" }
bytemuck = { version = "1.0", features = ["derive"] }
lyon_path = "1"
lyon_tessellation = "1"
pollster = "0.3"
wgpu = "29"
naga = { version = "29", features = ["wgsl-in", "glsl-out", "hlsl-out"], optional = true }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in", "glsl-out", "hlsl-out"] }

[lints]
workspace = true
