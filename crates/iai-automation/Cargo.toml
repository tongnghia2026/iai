[package]
name = "iai-automation"
version = "0.1.0"
edition = "2021"
description = "How AI agents and scripts reach iAi: MCP over stdio, the bridge to a running app, and the gate that holds them to what they were granted."
license = "AGPL-3.0-or-later"
repository = "https://github.com/tongnghia2026/iai"
publish = false

[lib]
name = "iai_automation"
path = "src/lib.rs"

[dependencies]
iai-canvas = { path = "../iai-canvas" }
iai-engine = { path = "../iai-engine" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
